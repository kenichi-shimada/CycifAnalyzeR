  <text x="36" y="86" class="note">Defunct as of this redesign: LdRunUMAP, LdPlot, ld_coords, ld_names, hist_1d, and LdClustering(Cycif|CycifStack) -- the legacy per-object pathway, zero external call sites.</text>
  <text x="36" y="102" class="note">LdClustering("matrix", ...) itself is still exported and live -- it is the engine clusterCells() calls internally.</text>
